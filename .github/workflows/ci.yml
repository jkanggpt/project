name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} + sanitizers
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            preset: linux-debug
          - compiler: clang
            preset: linux-clang-debug
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-18-dev
      - name: Configure and build C
        run: |
          cmake --preset ${{ matrix.preset }} -DCASTLE_WERROR=ON
          cmake --build --preset ${{ matrix.preset }}
      - name: CTest
        run: ctest --preset ${{ matrix.preset }} -j4
      - name: Short soak
        run: build/${{ matrix.preset }}/bin/castle_cli --soak 60 --seeds 5 --first-seed 1000

  # 160×160 세계에서는 ASan 빌드가 시드 하나 하루에 1초가 넘게 걸려 400일 × 20시드가 2시간을 넘습니다.
  # 긴 소크는 릴리스 빌드로 불변 조건만 보고, 메모리 오류는 위 Linux 작업의 ASan 짧은 소크와 CTest가 봅니다.
  soak:
    name: 400 days x 10 seeds (release)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: |
          cmake --preset linux-release -DCASTLE_BUILD_GAME=OFF -DCASTLE_BUILD_TESTS=OFF -DCASTLE_BUILD_TOOLS=OFF
          cmake --build --preset linux-release --target castle_cli
          build/linux-release/bin/castle_cli --soak 400 --seeds 10

  mingw:
    name: Linux to Windows C cross-compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-mingw-w64-x86-64
      - run: |
          cmake --preset mingw-release -DCASTLE_WERROR=ON
          cmake --build --preset mingw-release

  windows:
    name: Windows MSVC C game
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset windows-msvc -DCASTLE_WERROR=ON
      - run: cmake --build --preset windows-msvc
      - run: ctest --preset windows-msvc
      - name: C balance tool
        run: build/windows-msvc/bin/Release/castle_balance.exe --data game/data --seeds 1 --days 10 --difficulty 1
      - name: Package
        run: cmake --install build/windows-msvc --config Release --prefix build/release/MagicCastle --component Runtime
      - uses: actions/upload-artifact@v4
        with:
          name: MagicCastle-C-windows-x64
          path: build/release/MagicCastle/
          retention-days: 14

  graphics:
    name: Linux C game and screenshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build xvfb libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev
      - run: |
          cmake --preset linux-release -DCASTLE_WERROR=ON
          cmake --build --preset linux-release
          ctest --preset linux-release -j4
      - name: C game screenshot
        run: |
          mkdir -p build/reports/screenshots
          xvfb-run -a build/linux-release/bin/castle_game --screenshot build/reports/screenshots/native.png --screen game --no-audio
      - uses: actions/upload-artifact@v4
        with:
          name: MagicCastle-C-linux-screenshot
          path: build/reports/screenshots/
